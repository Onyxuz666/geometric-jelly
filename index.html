<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Geometric Jelly</title>
<meta name="description" content="A drum machine on the Tonnetz torus: every layer is a (p, q) torus knot, every strike tunes a resonator to the vertex it lands on, and p against q is the polyrhythm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Geometric Jelly <span>v2</span></h1>
    <p class="tagline">a drum machine on the Tonnetz torus</p>
  </header>

  <section class="transport" aria-label="Transport">
    <button class="play" id="play" aria-label="Play" title="Play (Space)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path id="playIcon" d="M5 3l12 7-12 7z" fill="currentColor"/></svg>
    </button>
    <div class="dial"><label for="bpm">Tempo</label><div class="dial-row"><input type="range" id="bpm" min="40" max="220" step="1"><span class="val" id="bpmVal"></span></div></div>
    <div class="dial"><label for="swing">Swing</label><div class="dial-row"><input type="range" id="swing" min="0.5" max="0.75" step="0.01"><span class="val" id="swingVal"></span></div></div>
    <div class="dial"><label for="humanize">Humanize</label><div class="dial-row"><input type="range" id="humanize" min="0" max="1" step="0.01"><span class="val" id="humanizeVal"></span></div></div>
    <div class="dial"><label for="preset">Preset</label><select id="preset"></select></div>
    <div class="realign" aria-live="off"><label>Realign</label><span class="val" id="realign">—</span></div>
  </section>

  <section class="stage-wrap">
    <div class="stage" id="stage" aria-label="Torus view. Drag a node to move it, drag outward to set velocity, drag off to delete. Drag empty space to rotate."></div>
    <div class="hud" id="hud"></div>
    <div class="stage-bar">
      <span class="lbl">Torus</span>
      <input type="range" id="flatten" min="0" max="1" step="0.01" aria-label="Flatten: torus to ring">
      <span class="lbl">Ring</span>
      <button class="tool" id="visual" title="Visual mode (V)">Visual</button>
    </div>
    <button class="exit-visual" id="exitVisual" aria-label="Exit visual mode">×</button>
  </section>

  <nav class="rail" id="rail" aria-label="Layers"></nav>

  <section class="bench" id="bench" aria-label="Selected layer"></section>

  <section class="bench bus" id="bus" aria-label="Bus"></section>

  <footer>
    <p><kbd>Space</kbd> play · <kbd>1</kbd>–<kbd>5</kbd> layer · <kbd>M</kbd> mute · <kbd>S</kbd> solo · <kbd>[</kbd> <kbd>]</kbd> rotate · <kbd>F</kbd> flatten · <kbd>V</kbd> visual · <kbd>Esc</kbd> exit</p>
    <p class="note" id="note" role="status"></p>
  </footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
